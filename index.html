        .annotation {
            background: #ffffff !important;

            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important;

            border: none !important;

        .care-item {
            background: rgba(255, 255, 255, 0.4) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 16px !important;

            display: flex;
            flex-direction: column;
            gap: 0.75rem;

        .care-item:hover {

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04) !important;

        .care-item span {
            font-size: 0.7rem !important;

            font-weight: 700 !important;
            color: #2d4a22 !important; /* Dark accent green */

<script>
// Dynamically inject the CTA button right below the hero meta info
document.addEventListener("DOMContentLoaded", () => {
    const observer = new MutationObserver((mutations, obs) => {
        const heroMeta = document.querySelector('.hero-meta');
        if (heroMeta && !document.querySelector('.modern-cta')) {
            const btn = document.createElement('a');
            btn.href = "https://wa.me/"; // Update with actual number if needed
            btn.className = "modern-cta";
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="22" height="22" fill="currentColor">
                    <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157.1zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                </svg>
                <span>Enquire on WhatsApp</span>
            `;
            heroMeta.parentNode.insertBefore(btn, heroMeta.nextSibling);
        }

        const heroTop = document.querySelector('.hero-top');
        if (heroTop && !document.querySelector('.custom-brand-logo')) {
            const oldLogo = heroTop.children[0];
            if (oldLogo) {
                oldLogo.style.display = 'none';
                const newLogo = document.createElement('img');
                newLogo.src = 'assets/home-logo.png';
                newLogo.className = 'custom-brand-logo';
                newLogo.style.height = '72px';
                newLogo.style.width = 'auto';
                newLogo.style.objectFit = 'contain';
                newLogo.style.filter = 'drop-shadow(0 4px 6px rgba(0,0,0,0.15))';
                newLogo.style.cursor = 'pointer';
                heroTop.insertBefore(newLogo, oldLogo);
            }
        }
        
        const siteFooter = document.querySelector('footer') || document.querySelector('[class*="footer"]');
        if (siteFooter && !siteFooter.querySelector('.custom-footer-logo')) {
            const svgs = siteFooter.querySelectorAll('svg');
            let replaced = false;
            for (let svg of svgs) {
                // Ignore small social icons
                if (!svg.classList.contains('lucide') && svg.getAttribute('width') !== '24' && svg.getAttribute('width') !== '15') {
                    // Hide EVERY non-social SVG we find to get rid of leftover abstract leaves
                    svg.style.display = 'none';
                    // Only insert the new logo image once
                    if (!replaced) {
                        const newLogo = document.createElement('img');
                        newLogo.src = 'assets/home-logo.png';
                        newLogo.className = 'custom-footer-logo';
                        newLogo.style.height = '64px';
                        newLogo.style.width = 'auto';
                        newLogo.style.objectFit = 'contain';
                        newLogo.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.15))'; 
                        newLogo.style.cursor = 'pointer';
                        svg.parentNode.insertBefore(newLogo, svg);
                        replaced = true;
                    }
                }
            }
            if (!replaced) {
                // Fallback: If it's text, look for "Midori"
                const elements = siteFooter.querySelectorAll('*');
                for (let el of elements) {
                    if (el.children.length === 0 && el.textContent.trim().toLowerCase().includes('midori')) {
                        el.textContent = '';
                        const newLogo = document.createElement('img');
                        newLogo.src = 'assets/home-logo.png';
                        newLogo.className = 'custom-footer-logo';
                        newLogo.style.height = '64px';
                        newLogo.style.width = 'auto';
                        newLogo.style.objectFit = 'contain';
                        el.appendChild(newLogo);
                        break;
                    }
                }
            }
        }
        
        if (document.querySelector('.modern-cta') && document.querySelector('.custom-brand-logo') && siteFooter?.querySelector('.custom-footer-logo')) {
            obs.disconnect();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
});
</script>
